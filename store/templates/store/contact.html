{% extends 'store/base.html' %}
{% block content %}
<section class="policy-shell">
    <div class="policy-hero luxury-panel">
        <p class="auth-kicker policy-kicker">{{ page.eyebrow }}</p>
        <h1>{{ page.title }}</h1>
        <p class="policy-intro">{{ page.intro }}</p>
    </div>

    <div class="contact-grid">
        {% for item in page.items %}
            <article class="policy-content-card luxury-panel contact-card">
                <h2>{{ item.label }}</h2>
                <p>{{ item.value }}</p>
            </article>
        {% endfor %}
    </div>
</section>
{% endblock %}
