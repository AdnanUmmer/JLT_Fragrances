{% extends 'store/base.html' %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card auth-card-entrance">
        <p class="auth-kicker">JLT FRAGRANCES</p>
        <h1>Reset Your Password</h1>
        <p class="auth-subheading">Enter your email and we will send a secure reset link.</p>

        <form method="post" class="auth-form" data-loading-form>
            {% csrf_token %}
            <div class="auth-field">
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" class="lux-input" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="luxury-primary-btn full-width" data-loading-button>
                <span>Send Reset Link</span>
                <span class="button-spinner" aria-hidden="true"></span>
            </button>
        </form>
    </div>
</section>
{% endblock %}
